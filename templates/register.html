{% extends "base.html" %}
{% block title %}Registro de paciente{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card glow-card wide-card">
        <div class="auth-header text-center">
            <div class="icon-wrap icon-secondary">
                <i data-lucide="user-plus"></i>
            </div>
            <span class="eyebrow text-center">Registro del paciente</span>
            <h2>Crear tu cuenta</h2>
            <p>Completa tus datos para comenzar a reservar citas.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form row g-3">
            <div class="col-md-6 field-group">
                <label>Nombre completo</label>
                <input type="text" name="nombre" required>
            </div>
            <div class="col-md-6 field-group">
                <label>Correo electrónico</label>
                <input type="email" name="correo" required>
            </div>
            <div class="col-md-6 field-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>
            <div class="col-md-6 field-group">
                <label>Documento</label>
                <input type="text" name="documento" required>
            </div>
            <div class="col-12 field-group">
                <label>Teléfono</label>
                <input type="text" name="telefono">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">Registrar cuenta</button>
            </div>
        </form>

        <div class="auth-footer">
            <span>¿Ya tienes cuenta?</span>
            <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </div>
    </div>
</div>
{% endblock %}
