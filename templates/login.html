{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card glow-card">
        <div class="auth-header text-center">
            <div class="icon-wrap">
                <i data-lucide="shield-check"></i>
            </div>
            <span class="eyebrow text-center">Acceso seguro</span>
            <h2>Iniciar sesión</h2>
            <p>Ingresa tus credenciales para entrar al sistema.</p>
        </div>

        <div id="error-msg" class="error-box d-none"></div>

        <form onsubmit="manejarLogin(event)" class="auth-form">
            <div class="field-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="admin@centromedico.com" required>
            </div>
            <div class="field-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">
                Entrar al sistema
                <i data-lucide="arrow-right" class="ms-2"></i>
            </button>
        </form>

        <div class="auth-footer">
            <span>¿No tienes cuenta?</span>
            <a href="{{ url_for('auth.register') }}">Regístrate aquí</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function manejarLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            const destino = data.role === 'admin'
                ? '/admin/dashboard'
                : data.role === 'medico'
                    ? '/medico/inicio'
                    : '/paciente/inicio';
            window.location.href = destino;
        } else {
            mostrarError(data.error || 'Credenciales incorrectas');
        }
    } catch (error) {
        mostrarError('Error de conexión con el servidor');
    }
}
</script>
{% endblock %}
